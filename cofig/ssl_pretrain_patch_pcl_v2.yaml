# =========================================================
# SegAlign-SSL v2-fast (light SSL for pathology)
# - 冻结大部分 backbone
# - 去掉 grayscale
# - 降低 blur
# - 降低结构损失权重
# - 短周期轻量自监督
# =========================================================

# =========================
# 数据data_root: "C:/D/Data/half_crop"
# =========================
# data_root: "C:/D/Data/glas_processed/glas"
# data_root: "D:/TCGA-PRAD_patch224_spacing05_flat"
data_root: "C:/D/Data/LUNG"
image_size: 224
patch_size: 16

# =========================
# Backbone
# =========================
backbone_impl: "timm"

# HF 模式
vit_path: "C:/D/Project/vit-base-patch16-224"
hf_model_name_or_path: ""
vit_weight_path: ""

# timm 模式（不用可留空）
timm_model_name: "vit_base_patch16_224"
timm_pretrained: false
coach_bin: "C:/D/Project/coach/pytorch_model.bin"

# =========================
# 训练
# =========================
batch_size: 8
epochs: 30 
lr: 0.0001
backbone_lr: 0.00001
warmup_epochs: 1
weight_decay: 0.05
num_workers: 4
seed: 42
device: "cuda"
use_amp: true

# 冻结大部分 backbone，只训练最后几层
# train_last_n_blocks: 6

# =========================
# EMA
# =========================
ema_m_base: 0.996
ema_m_final: 0.9999

# =========================
# Mask
# =========================
mask_ratio: 0.3
mask_fill_mode: "mean"

# =========================
# PCL
# =========================
proj_dim: 256
temperature: 0.2
pcl_teacher_temperature: 0.1
pcl_conf_power: 1.5
pcl_num_sampled_patches: 64

# =========================
# Structure / Loss
# =========================
num_regions: 16
# w_pcl: 1.0
# w_mpr: 1.5
# w_struct: 4
w_pcl: 0
w_mpr: 1.0
w_struct: 0

mpr_mse_alpha: 0.5
mpr_cos_beta: 0.5

# =========================
# 保存 / 恢复
# =========================
out_dir: "ssl_checkpoints_v2_lightPRADm"
save_every: 5
log_interval: 20
resume_from: ""
